name: offline-source-validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Publication path policy
        run: python scripts/publication_policy.py
      - name: Install dependencies (no broker credentials)
        run: python -m pip install -r requirements.txt
      - name: Offline test suite
        run: python scripts/offline_tests.py
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verified scanner download
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --tlsv1.2 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Redacted source and history scan
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner --log-opts=--all
